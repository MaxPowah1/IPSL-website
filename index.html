<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inter Paucos Silentium Loquitur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <span class="bracket left">[</span>
    <span id="typed" class="text" role="button" tabindex="0"></span>
    <span class="bracket right">]</span>
</div>

<script>
    const text = document.getElementById("typed");
    const messages = [
        "Inter paucos silentium loquitur",
        "Qui scit, satis est",
        "join."
    ];
    let index = 0;

    function typeMessage(msg) {
        // Zielbreite anhand Zeichenlänge setzen
        text.style.setProperty("--chars", msg.length);

        // Animation sauber resetten (wichtig!)
        text.classList.remove("done", "typing");
        text.style.animation = "none";   // CSS-Animation stoppen
        void text.offsetWidth;           // Reflow erzwingen
        text.style.animation = "";       // Inline-Reset

        // Text setzen und Animation wieder aktivieren
        text.textContent = msg;
        text.classList.add("typing");
    }

    // Initial starten, wenn DOM fertig
    document.addEventListener("DOMContentLoaded", () => {
        typeMessage(messages[0]);
    });

    // Nach Ende der Tipp-Animation Cursor ausblenden
    text.addEventListener("animationend", (e) => {
      if (e.animationName === "typing") {
        text.classList.add("done");
      }
    });

    function advance() {
        if (index < messages.length - 1) {
            index += 1;
            typeMessage(messages[index]);
        }
    }

    // Maus & Tastatur
    text.addEventListener("click", advance);
    text.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        advance();
      }
    });
</script>
</body>
</html>
